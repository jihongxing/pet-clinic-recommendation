name: Quality Gate

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  frontend-quality:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

  backend-quality:
    name: Backend Release Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: pet_clinic_recommendation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pet_clinic_recommendation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3000
      APP_NAME: pet-clinic-recommendation-backend
      API_PREFIX: /api/v1
      TRUST_PROXY: "false"
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_password
      DB_DATABASE: pet_clinic_recommendation
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 7d
      WECHAT_APPID: ci-wechat-appid
      WECHAT_SECRET: ci-wechat-secret
      SWAGGER_ENABLED: "false"
      LOG_LEVEL: warn
      LOG_DIR: logs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend release gate
        run: npm run check:release
